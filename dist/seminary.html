    <style>
:root {
  --bg: #0e1016;
  --bg-elev: #171a23;
  --bg-elev-2: #1e222d;
  --line: #272c39;
  --text: #e8eaf2;
  --muted: #9aa1b5;
  --accent: #7b8cff;
  --accent-soft: #2a3160;
  --warn: #efb057;
  --danger: #f0736a;
  --ok: #4fbf8b;
  --radius: 14px;
  --tabbar: 62px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f9;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f2f7;
    --line: #e0e3ec;
    --text: #191c25;
    --muted: #6b7285;
    --accent: #4d5fe0;
    --accent-soft: #e4e7ff;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 16px;
}

.brand strong {
  display: block;
  font-size: 15px;
  letter-spacing: 0.2px;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* ---------- layout ---------- */

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.card h2 {
  margin: 0 0 10px;
  font-size: 14px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.card-head h2 {
  margin: 0;
  color: var(--text);
  text-transform: none;
  font-size: 17px;
}

.card-when {
  color: var(--muted);
  font-size: 12.5px;
}

.topic {
  margin: 4px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 10px;
}

.empty {
  color: var(--muted);
  font-size: 13.5px;
  padding: 6px 0;
  list-style: none;
}

.muted {
  color: var(--muted);
}

/* ---------- hero ---------- */

.hero {
  background: linear-gradient(150deg, var(--accent-soft), var(--bg-elev) 70%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
}

.hero-date {
  color: var(--muted);
  font-size: 13px;
}

.hero-mins {
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -0.5px;
  margin: 2px 0;
}

.hero-sub {
  color: var(--muted);
  font-size: 12.5px;
}

.bar {
  height: 6px;
  background: var(--bg-elev-2);
  border-radius: 99px;
  margin: 12px 0 6px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.25s ease;
}

/* ---------- tasks ---------- */

.tasks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}

.task:first-child {
  border-top: 0;
}

.task.is-done .task-title,
.task.is-done .task-detail {
  text-decoration: line-through;
  color: var(--muted);
}

.task-body {
  flex: 1;
  min-width: 0;
}

.task-title {
  font-size: 14.5px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.task-detail {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 2px;
}

.task-flag {
  color: var(--warn);
  font-size: 12px;
  margin-top: 3px;
}

.check {
  display: block;
  padding-top: 2px;
  cursor: pointer;
}

.check input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.box {
  display: block;
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  background: var(--bg-elev-2);
}

.check input:checked + .box {
  background: var(--accent);
  border-color: var(--accent);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");
  background-size: 14px;
  background-repeat: no-repeat;
  background-position: center;
}

.check input:focus-visible + .box {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.amount {
  flex-shrink: 0;
  background: var(--bg-elev-2);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-family: inherit;
}

.amount.editable {
  cursor: pointer;
  color: var(--text);
}

.amount:disabled {
  cursor: default;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  background: var(--dot, var(--accent));
  flex-shrink: 0;
  display: inline-block;
}

.tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 5px;
}

.tags:empty {
  display: none;
}

.pill {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--bg-elev-2);
  color: var(--muted);
  border: 1px solid var(--line);
}

.pill.accent {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: transparent;
}

.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 35%, transparent);
}

/* ---------- day plan ---------- */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stats > div {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
}

.stat {
  display: block;
  font-size: 16px;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
}

.stats small {
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.25;
  display: block;
  margin-top: 2px;
}

.days {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.day {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}

.day.is-today {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
}

.day-head {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 2px;
}

.day.is-today .day-name {
  color: var(--accent);
  font-weight: 600;
}

.day-mins {
  font-variant-numeric: tabular-nums;
}

.all-readings {
  margin-top: 12px;
}

summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- deadlines ---------- */

.deadline {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.deadline:first-of-type {
  border-top: 0;
}

.deadline-when {
  width: 84px;
  flex-shrink: 0;
}

.deadline-when strong {
  display: block;
  font-size: 13.5px;
}

.deadline-when span {
  color: var(--muted);
  font-size: 11.5px;
}

.deadline.urgent .deadline-when strong {
  color: var(--danger);
}

.deadline.soon .deadline-when strong {
  color: var(--warn);
}

.deadline-title {
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.deadline-detail {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 2px;
}

/* ---------- schedule ---------- */

.schedule {
  display: flex;
  flex-direction: column;
}

.sched-item {
  border-top: 1px solid var(--line);
  padding: 8px 0;
}

.sched-item:first-child {
  border-top: 0;
}

.sched-item.is-past {
  opacity: 0.5;
}

.sched-item summary {
  display: grid;
  grid-template-columns: 54px 74px 1fr auto 46px;
  gap: 8px;
  align-items: center;
  color: var(--text);
  font-size: 13.5px;
}

.sched-date,
.sched-load {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.sched-course {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}

.sched-topic {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sched-item .tasks {
  margin-top: 8px;
  padding-left: 4px;
}

@media (max-width: 480px) {
  .sched-item summary {
    grid-template-columns: 50px 1fr auto;
    grid-template-areas: 'date topic topic' 'course load progress';
  }
  .sched-date {
    grid-area: date;
  }
  .sched-topic {
    grid-area: topic;
  }
  .sched-course {
    grid-area: course;
  }
  .sched-load {
    grid-area: load;
    text-align: right;
  }
  .sched-progress {
    grid-area: progress;
  }
}

/* ---------- settings ---------- */

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}

.row:first-of-type {
  border-top: 0;
}

.row label {
  flex: 1;
  font-size: 14px;
}

.row input[type='number'] {
  width: 72px;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 9px;
  font: inherit;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.unit {
  color: var(--muted);
  font-size: 12.5px;
  width: 34px;
}

.status {
  font-size: 12px;
  color: var(--muted);
  text-transform: capitalize;
}

.status.ok {
  color: var(--ok);
}

.btn {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 9px;
  padding: 8px 14px;
  font: inherit;
  font-size: 13.5px;
  cursor: pointer;
}

.btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.btn.ghost {
  background: var(--bg-elev-2);
  color: var(--text);
  border: 1px solid var(--line);
}

.btn.danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
}

.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 99px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.chip.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ---------- tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 10.5px;
  padding: 8px 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}

.tab svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab.on {
  color: var(--accent);
}

.row input[type='time'] {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 9px;
  font: inherit;
  font-variant-numeric: tabular-nums;
}

.row label .dot {
  margin-right: 6px;
}

.sched-mode {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  margin-left: 6px;
  white-space: nowrap;
}

.warn-note {
  color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  border-radius: 10px;
  padding: 9px 11px;
}

/* ---------- progress bars ---------- */

.progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.progress-track {
  flex: 1;
  height: 7px;
  background: var(--bg-elev-2);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width 0.25s ease;
}

.progress.is-complete .progress-fill {
  background: var(--ok);
}

.progress-pct {
  flex-shrink: 0;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  width: 32px;
  text-align: right;
}

.progress.is-complete .progress-pct {
  color: var(--ok);
}

.progress-sm {
  margin-top: 4px;
  gap: 6px;
}

.progress-sm .progress-track {
  height: 4px;
}

.progress-sm .progress-pct {
  font-size: 10.5px;
  width: 28px;
}

.sched-progress {
  flex-shrink: 0;
  width: 46px;
}

.sched-progress .progress-track {
  height: 5px;
}

.course-progress + .course-progress {
  margin-top: 14px;
}

.course-progress-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13.5px;
}

.course-progress-head > span:first-child {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 560;
}

.course-progress-head .muted {
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✝</span>
        <span>
          <strong>Seminary</strong>
          <small>Fall 2026</small>
        </span>
      </div>
    </header>

    <main id="app" class="app">
      <section class="card"><p class="note">Loading your schedule…</p></section>
    </main>

    <nav class="tabbar">
      <button class="tab on" data-view="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l6 3" /><circle cx="12" cy="12" r="9" /></svg>
        Today
      </button>
      <button class="tab" data-view="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
        Plan
      </button>
      <button class="tab" data-view="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        Schedule

        return `
        <section class="card">
          <div class="card-head" style="--accent:${esc(course.color)}">
            <h2>${dot(course.color)}${esc(course.name)}</h2>
            <span class="card-when">${esc(S.relativeDay(date))} · ${esc(S.formatDate(date))}, ${esc(classTimeLabel(course))}</span>
          </div>
          <p class="topic">${esc(session.topic)}</p>
          <div class="tags">${modePill(session)}</div>
          ${progressBar(w)}
          <div class="stats">
            <div><span class="stat">${pagesLeft}</span><small>pages left of ${pages}</small></div>
            <div><span class="stat">${S.formatMinutes(w.remaining)}</span><small>of ${S.formatMinutes(w.total)}</small></div>
            <div><span class="stat">${plan.days}</span><small>study days</small></div>
            <div><span class="stat">${S.formatMinutes(plan.perDay)}</span><small>per day</small></div>
          </div>
          <div class="days">${plan.plan.map((d) => dayRow(d, course.color)).join('')}</div>
          <details class="all-readings">
            <summary>Everything due for this class (${tasks.length})</summary>
            <ul class="tasks">${tasks.map((t) => taskLine(t)).join('')}</ul>
          </details>
        </section>`;
      })
      .join('')}

    ${
      projects.length
        ? `<section class="card">
            <h2>Long-run work</h2>
            <ul class="tasks">
              ${projects
                .map(
                  ({ task, pace }) => `
                <li class="task">
                  <label class="check">
                    <input type="checkbox" data-action="toggle" data-key="${esc(task.key)}" ${task.complete ? 'checked' : ''}>
                    <span class="box"></span>
                  </label>
                  <div class="task-body">
                    <div class="task-title">${dot(task.color)}${esc(task.title)}</div>
                    <div class="task-detail">${esc(task.courseName)} · due ${esc(S.formatDate(S.dueAt(task)))} (${esc(S.relativeDay(S.dueAt(task)))})</div>
                    <div class="task-detail muted">${S.formatMinutes(task.read)} logged · ${S.formatMinutes(task.remaining)} left · aim for ${S.formatMinutes(pace.perDay)}/day</div>
                  </div>
                  <button class="amount editable" data-action="log-project" data-key="${esc(task.key)}">log</button>
                </li>`
                )
                .join('')}
            </ul>
          </section>`
        : ''
    }`;
}

function viewSchedule() {
  const today = S.startOfToday();
  const rows = [];
  for (const course of DATA.courses) {
    for (const session of course.sessions) {
      rows.push({ course, session, date: S.parseDate(session.date) });
    }
  }
  rows.sort((a, b) => a.date - b.date || a.course.id.localeCompare(b.course.id));

  return `
    <section class="card">
      <h2>${esc(DATA.term)} — full schedule</h2>
      <div class="schedule">
        ${rows
          .map(({ course, session, date }) => {
            const past = date < today;
            const tasks = TASKS.filter((t) => t.courseId === course.id && t.sessionDate === session.date);
            const w = S.workload(tasks);
            const pages = tasks.reduce((a, t) => a + (t.unit === 'pages' ? t.pages : 0), 0);
            return `
            <details class="sched-item ${past ? 'is-past' : ''}" ${S.daysBetween(today, date) >= 0 && S.daysBetween(today, date) <= 7 ? 'open' : ''}>
              <summary>
                <span class="sched-date">${esc(S.formatDate(date, { month: 'short', day: 'numeric' }))}</span>
                <span class="sched-course">${dot(course.color)}${esc(course.short)}</span>
                <span class="sched-topic">${esc(session.topic)}${session.mode ? ` <em class="sched-mode">${esc(MODE_LABELS[session.mode])}</em>` : ''}</span>
                <span class="sched-load">${pages ? `${pages} pp.` : ''}${w.total ? ` · ${S.formatMinutes(w.total)}` : ''}</span>
                ${w.total ? `<span class="sched-progress">${progressBar(w, { size: 'progress-sm', label: false })}</span>` : ''}
              </summary>
              <ul class="tasks">${tasks.map((t) => taskLine(t)).join('') || '<li class="empty">No work listed.</li>'}</ul>
            </details>`;
          })
          .join('')}
      </div>
    </section>`;
}

function viewSettings() {
  const s = store.settings();
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const perm = notify.permission();

  return `
    <section class="card">
      <h2>Reminders</h2>
      <p class="note">
        Reminders fire at ${store.settings().leadDays} days, 3 days, 1 day, and on the due date.
        This app has no server, so it raises them when it is open or when your browser wakes it in
        the background — keep it on your home screen and open it once a day.
      </p>
      ${
        location.protocol === 'file:'
          ? `<p class="note warn-note">You are running the single-file copy straight off this device.
               Everything works except reminders — browsers do not allow notifications from a page
               opened out of the filesystem. For those, use the hosted copy added to your home screen.</p>`
          : ''
      }
      <div class="row">
        <label for="notif">Notifications</label>
        <span class="status ${perm === 'granted' ? 'ok' : ''}">${esc(perm)}</span>
        <button class="btn" data-action="enable-notif" ${perm === 'granted' && s.notificationsEnabled ? 'disabled' : ''}>
          ${perm === 'granted' && s.notificationsEnabled ? 'On' : 'Turn on'}
        </button>
      </div>
      <div class="row">
        <label for="lead">Warn me this far ahead</label>
        <input id="lead" type="number" min="1" max="21" value="${s.leadDays}" data-setting="leadDays">
        <span class="unit">days</span>
      </div>
      <div class="row">
        <label for="hour">Daily nudge after</label>
        <input id="hour" type="number" min="0" max="23" value="${s.reminderHour}" data-setting="reminderHour">
        <span class="unit">:00</span>
      </div>
      <button class="btn ghost" data-action="test-notif">Send a test notification</button>
    </section>

    <section class="card">
      <h2>Class times</h2>
      <p class="note">
        Not confirmed yet, so the app assumes <strong>6:00 pm</strong> and marks it as an assumption.
        The time matters for two things: when a due-date reminder counts as passed, and whether class
        day itself is still available to read in — for an evening class it is, so the plan uses it.
      </p>
      ${DATA.courses
        .map(
          (c) => `
        <div class="row">
          <label for="ct-${esc(c.id)}">${dot(c.color)}${esc(c.name)}${c.meetingDay ? ` <span class="muted">· ${esc(c.meetingDay)}s</span>` : ''}</label>
          ${S.classTimeIsAssumed(c) ? '<span class="status">assumed</span>' : '<span class="status ok">set</span>'}
          <input id="ct-${esc(c.id)}" type="time" value="${esc(S.classTimeFor(c))}" data-classtime="${esc(c.id)}">
        </div>`
        )
        .join('')}
      <button class="btn ghost" data-action="clear-times">Back to assumed times</button>
    </section>

    <section class="card">
      <h2>Study days</h2>
      <p class="note">Reading is spread across the days you tick. Untick your day off.</p>
      <div class="chips">
        ${dayNames
          .map(
            (n, i) =>
              `<button class="chip ${s.studyDays.includes(i) ? 'on' : ''}" data-action="toggle-day" data-day="${i}">${n}</button>`
          )
          .join('')}
      </div>
    </section>

    <section class="card">
      <h2>Pace</h2>
      <p class="note">How the app converts pages and verses into a daily time target. Tune these once you know your real speed.</p>
      <div class="row">
        <label for="mpp">Minutes per page</label>
        <input id="mpp" type="number" min="1" max="20" value="${s.minsPerPage}" data-setting="minsPerPage">
      </div>
      <div class="row">
        <label for="mpv">Minutes per Greek verse</label>
        <input id="mpv" type="number" min="1" max="30" value="${s.minsPerGreekVerse}" data-setting="minsPerGreekVerse">
      </div>
      <div class="row">
        <label for="mpc">Minutes per Bible chapter</label>
        <input id="mpc" type="number" min="1" max="30" value="${s.minsPerBibleChapter}" data-setting="minsPerBibleChapter">
      </div>
      <div class="row">
        <label for="dcp">Default pages per chapter</label>
        <input id="dcp" type="number" min="1" max="80" value="${s.defaultChapterPages}" data-setting="defaultChapterPages">
      </div>
    </section>

    <section class="card">
      <h2>Data</h2>
      <p class="note">
        Progress lives on this device only. Page counts marked <em>estimated</em> are guesses —
        tap any page count in the app to replace it with the real number.
      </p>
      <div class="btn-row">
        <button class="btn ghost" data-action="export">Export progress</button>
        <button class="btn ghost" data-action="import">Import progress</button>
        <button class="btn danger" data-action="reset">Reset progress</button>
      </div>
      <p class="note">Term: ${esc(DATA.term)} · ${DATA.courses.length} courses · ${TASKS.length} tracked items</p>
    </section>`;
}

/* ---------------- shell ---------------- */

const VIEWS = { today: viewToday, plan: viewPlan, schedule: viewSchedule, settings: viewSettings };

function render() {
  const main = $('#app');
  main.innerHTML = (VIEWS[view] || viewToday)();
  main.scrollTop = 0;
  document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('on', el.dataset.view === view));
  document.title = view === 'today' ? 'Seminary — Today' : `Seminary — ${view}`;
}

function go(next) {
  view = next;
  location.hash = next;
  render();
}

/* ---------------- interactions ---------------- */

document.addEventListener('click', async (e) => {
  const tab = e.target.closest('.tab');
  if (tab) return go(tab.dataset.view);

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, key } = el.dataset;

  if (action === 'toggle') {
    store.setDone(key, el.checked);
    if (!el.checked) store.setProgress(key, 0);
    return refresh();
  }

  if (action === 'chunk') {
    const through = Number(el.dataset.through);
    const total = Number(el.dataset.total);
    if (el.checked) {
      store.setProgress(key, through);
      if (through >= total) store.setDone(key, true);
    } else {
      // Rewind to the page this chunk started on.
      store.setDone(key, false);
      store.setProgress(key, Number(el.dataset.from) || 0);
    }
    return refresh();
  }

  if (action === 'edit-pages') {
    const task = TASKS.find((t) => t.key === key);
    const answer = prompt(`How many pages is "${task.title}" really?`, task.pages);
    if (answer === null) return;
    const n = parseInt(answer, 10);
    store.setOverride(key, Number.isFinite(n) && n > 0 ? n : null);
    return refresh();
  }

  if (action === 'log-project') {
    const task = TASKS.find((t) => t.key === key);
    const answer = prompt(`Minutes to log for "${task.title}"?`, 30);
    if (answer === null) return;
    const n = parseInt(answer, 10);
    if (Number.isFinite(n) && n > 0) store.setProgress(key, store.progressFor(key) + n);
    return refresh();
  }

  if (action === 'toggle-day') {
    const day = Number(el.dataset.day);
    const days = store.settings().studyDays;
    const next = days.includes(day) ? days.filter((d) => d !== day) : [...days, day].sort();
    if (next.length) store.updateSettings({ studyDays: next });
    return refresh();
  }

  if (action === 'enable-notif') {
    const result = await notify.requestPermission();
    if (result === 'granted') {
      await notify.registerBackgroundChecks();
      await notify.testNotification();
    } else {
      alert(`Your browser answered: ${result}. On iPhone, add this app to your Home Screen first, then try again.`);
    }
    return refresh();
  }

  if (action === 'test-notif') {
    const ok = await notify.testNotification();
    if (!ok) alert('Notifications are not permitted yet — turn them on above.');
    return;
  }

  if (action === 'export') {
    const blob = new Blob([store.exportData()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `seminary-progress-${S.toISO(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }

  if (action === 'import') {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async () => {
      try {
        store.importData(await input.files[0].text());
        refresh();
      } catch (err) {
        alert(`That file could not be read: ${err.message}`);
      }
    };
    input.click();
    return;
  }

  if (action === 'clear-times') {
    store.updateSettings({ classTimes: {} });
    return refresh();
  }

  if (action === 'reset') {
    if (confirm('Clear every tick, page marker and fired reminder? Settings are kept.')) {
      store.resetProgress();
      refresh();
    }
  }
});

document.addEventListener('change', (e) => {
  const time = e.target.closest('[data-classtime]');
  if (time) {
    const next = { ...store.settings().classTimes };
    if (time.value) next[time.dataset.classtime] = time.value;
    else delete next[time.dataset.classtime];
    store.updateSettings({ classTimes: next });
    return refresh();
  }

  const el = e.target.closest('[data-setting]');
  if (!el) return;
  const n = Number(el.value);
  if (!Number.isFinite(n)) return;
  store.updateSettings({ [el.dataset.setting]: n });
  refresh();
});

window.addEventListener('hashchange', () => {
  const next = location.hash.replace('#', '') || 'today';
  if (next !== view) go(next);
});

function refresh() {
  rebuild();
  render();
}

/* ---------------- boot ---------------- */

async function checkReminders() {
  await notify.checkReminders(TASKS);
  await notify.dailyNudge(todayBucket());
}

async function boot() {
  try {
    DATA = await loadData();
  } catch (err) {
    $('#app').innerHTML = `<section class="card"><h2>Could not start</h2><p class="note">${esc(err.message)}</p>
      <p class="note">This app must be served over http(s), not opened as a file.</p></section>`;
    return;
  }
  rebuild();
  render();

  // A page opened straight off the filesystem cannot have a service worker,
  // and does not need one — it is already local.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    try {
      await navigator.serviceWorker.register('./sw.js');
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data?.type === 'check-deadlines') checkReminders();
      });
    } catch (err) {
      console.warn('Service worker registration failed', err);
    }
  }

  await checkReminders();

  // Re-check when you come back to the app, and if it is left open overnight.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      refresh();
      checkReminders();
    }
  });
  setInterval(checkReminders, 60 * 60 * 1000);
}

boot();
return {  };
})();
</script>
