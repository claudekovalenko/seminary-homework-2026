<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Seminary — Today</title>
    <meta name="description" content="Reading plan, workload breakdown and deadline reminders for the Fall 2026 seminary courses." />
    <meta name="theme-color" content="#12141c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seminary" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✝</span>
        <span>
          <strong>Seminary</strong>
          <small>Fall 2026</small>
        </span>
      </div>
    </header>

    <main id="app" class="app">
      <section class="card"><p class="note">Loading your schedule…</p></section>
    </main>

    <nav class="tabbar">
      <button class="tab on" data-view="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l6 3" /><circle cx="12" cy="12" r="9" /></svg>
        Today
      </button>
      <button class="tab" data-view="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
        Plan
      </button>
      <button class="tab" data-view="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        Schedule
      </button>
      <button class="tab" data-view="files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        Files
      </button>
      <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" /></svg>
        Settings
      </button>
    </nav>

    <script type="module" src="./js/bundle.js?v=v12"></script>
  </body>
</html>
